[project]
name = "sic"
version = "0.1.0"
description = "Zielorientierte, statisch typisierte Programmiersprache"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.3,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
sic = "sic.cli:main"

[dependency-groups]
dev = ["httpx2>=1", "pytest==8.4.2"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: echter lokaler Lauf mit dem MLX-Modell"]
